[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-alcf"
version = "0.4.0"
description = "llm-rosetta extension: ALCF inference shims (Metis, Minerva, Sophia) and the Globus sign-in exchange"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0.dev40"]

[project.entry-points."llm_rosetta.extensions"]
alcf = "llm_rosetta_ext.alcf"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the package is listed, so tests/ and the packaging
# files stay out of the wheel.  The shim tree's folders hold no __init__.py,
# so the data files the loader reads are named below.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.alcf" = "." }
packages = ["llm_rosetta_ext.alcf"]

[tool.setuptools.package-data]
"llm_rosetta_ext.alcf" = ["assets/alcf.svg", "metis/llm/provider.yaml", "metis/llm/transforms.py", "minerva/llm/provider.yaml", "minerva/llm/transforms.py", "plugin.yaml", "provider.yaml", "sophia/llm/provider.yaml", "sophia/llm/transforms.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
