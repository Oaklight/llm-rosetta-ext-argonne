[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-asksage"
version = "0.4.0"
description = "llm-rosetta extension: AskSage shims (chat, responses, messages, Google generate, embeddings) and the key-to-token exchange"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0"]

[project.entry-points."llm_rosetta.extensions"]
asksage = "llm_rosetta_ext.asksage"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the package is listed, so tests/ and the packaging
# files stay out of the wheel.  The shim tree's folders hold no __init__.py,
# so the data files the loader reads are named below.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.asksage" = "." }
packages = ["llm_rosetta_ext.asksage"]

[tool.setuptools.package-data]
"llm_rosetta_ext.asksage" = ["assets/asksage.webp", "embeddings/provider.yaml", "llm/chat_completions/provider.yaml", "llm/chat_completions/transforms.py", "llm/google_generate/provider.yaml", "llm/messages/provider.yaml", "llm/open_responses/provider.yaml", "llm/open_responses/transforms.py", "plugin.yaml", "provider.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
