name: CI
on:
  pull_request:
  push:
    branches: [main]

# llm-rosetta 0.14.0 is not on PyPI yet: install the development pair from
# TestPyPI. When 0.14.0 ships, drop the pre-release flag and the extra index.
env:
  CORE_SPEC: "llm-rosetta>=0.14.0.dev0"
  CORE_INDEX: "https://test.pypi.org/simple/"

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_layout.py

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The asksage embeddings tests import the gateway distribution.
      - run: python -m pip install --pre "$CORE_SPEC" llm-rosetta-gateway pytest --extra-index-url "$CORE_INDEX"
      - name: Check every folder and every wheel
        run: |
          for folder in packages/*/; do llm-rosetta ext check "$folder" --no-build; done
          python scripts/check_wheels.py
      - name: The standalone tunnel script matches tunnel.py
        run: python scripts/sync_argo_tunnel_script.py --check
      - name: Test
        run: |
          for id in $(ls packages); do python -m pytest -p no:cacheprovider "packages/$id" -q; done
          python -m pytest -p no:cacheprovider tests -q

  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --pre "$CORE_SPEC" --extra-index-url "$CORE_INDEX"
      - name: The index builds and the installer reads it
        run: python scripts/build_index.py --relative --out dist
