# Vendor manifest: the credential and the model-id field every Argo lane
# shares, and the mark it shows.
# The mark is the vendor's own wordmark, cut out of the banner it publishes
# and traced to a path -- the source is a 24px raster, so the pixels carry
# its anti-aliasing and no font or bitmap is needed here.  The URL pins this
# repository's v0.4.0 tag, which holds the file: jsDelivr's @main copy kept
# serving a previous cut after a purge, and a mark is content, not
# configuration.  The per-vendor repository it was first cut in is archived.
# Replacing the mark needs a new tag carrying the file and a new value here.
logo: https://cdn.jsdelivr.net/gh/Oaklight/llm-rosetta-shim-argonne@v0.4.0/assets/argo.svg
group_label: Argo
# A leaf inherits every field here and may override any of them.
connection:
  # Argo authenticates with the operator's ANL account name, and this vendor's
  # ``auth.py`` is the exchange that says so: it declares ``consumes_key``, so
  # the name here is the exchange's *input*, not a second credential, and the
  # panel keeps the key field for it.  The variable is a default for a host
  # that exports it; the provider entry's ``api_key`` wins over it.
  api_key_env: ARGO_API_KEY
  model_id_field: internal_id
  # The credential cannot change on its own — but the tunnel underneath it can
  # drop, and that is what this exchange watches.  A re-mint is one loopback
  # connect, so a short interval costs nothing and the panel notices a dead
  # forward long before the client does.
  token_refresh_interval: 300
