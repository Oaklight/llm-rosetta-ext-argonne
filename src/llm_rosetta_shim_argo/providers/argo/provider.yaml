# Vendor manifest: the credential and the model-id field every Argo lane
# shares, and the mark it shows.
# The mark is the vendor's own wordmark, cut out of the banner it publishes
# and traced to a path -- the source is a 24px raster, so the pixels carry
# its anti-aliasing and no font or bitmap is needed here.  The URL pins the
# commit the mark was cut in: jsDelivr's @main copy kept serving the previous
# cut after a purge, and a mark is content, not configuration.
logo: https://cdn.jsdelivr.net/gh/Oaklight/llm-rosetta-shim-argo@c1925c14f35170aa4f839c7fb8b97de58c2d4bee/assets/argo.svg
# A leaf inherits every field here and may override any of them.
connection:
  api_key_env: ARGO_API_KEY
  model_id_field: internal_id
