[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-shim-alcf"
dynamic = ["version"]
description = "ALCF (Argonne) provider shims for llm-rosetta, delivered as a plugin package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
keywords = ["llm", "llm-rosetta", "shim", "alcf", "provider"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]
# The vendor manifest (``providers/alcf/provider.yaml``) needs the manifest
# loader and, since it carries ``logo`` / ``group`` / ``group_label``, a core
# that reads identity from a manifest: dev30 and everything before it refuses
# that file ("a vendor manifest may declare only a 'connection:' block"), which
# would take the whole package down with it.  A final release sorts above its
# dev releases, so 0.14.0 satisfies this floor too.
dependencies = ["llm-rosetta>=0.14.0.dev31"]

[project.urls]
Repository = "https://github.com/Oaklight/llm-rosetta-shim-alcf"
Upstream = "https://github.com/Oaklight/llm-rosetta"

[project.entry-points."llm_rosetta.shim_providers"]
alcf = "llm_rosetta_shim_alcf:register_shims"

[tool.setuptools.dynamic]
version = { attr = "llm_rosetta_shim_alcf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_rosetta_shim_alcf = ["providers/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
